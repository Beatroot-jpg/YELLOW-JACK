<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yellow Jack – Login</title>
  <style>
    :root {
      /* 60-30-10 Color Scheme */
      --primary-60: #643711;      /* 60% - Main background */
      --secondary-30: #331c0a;    /* 30% - Cards/sections */
      --accent-10: #fee250;       /* 10% - Accents/highlights */

      /* Keep original text colors */
      --text-main: #f5f5f5;
      --text-muted: #a3a3a3;
      --border-subtle: rgba(254, 226, 80, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--primary-60);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top left, rgba(254, 226, 80, 0.08), transparent 55%),
        radial-gradient(circle at bottom right, rgba(254, 226, 80, 0.05), transparent 55%),
        var(--primary-60);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-section img {
      width: 240px;
      height: 240px;
      margin-bottom: 20px;
      filter: brightness(0.95);
    }

    .logo-section h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-10);
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(254, 226, 80, 0.3);
    }

    .logo-section p {
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    .login-card {
      background: var(--secondary-30);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .login-card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 24px;
      color: var(--accent-10);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--primary-60);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 1rem;
      transition: all 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-10);
      background: rgba(100, 55, 17, 0.8);
      box-shadow: 0 0 0 2px rgba(254, 226, 80, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-10);
      color: var(--secondary-30);
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .login-btn:hover {
      background: #ffeb70;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(254, 226, 80, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-message {
      background: rgba(255, 100, 100, 0.1);
      border: 1px solid rgba(255, 100, 100, 0.3);
      color: #ff6464;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <img src="Main Logo.png" alt="Yellow Jack Logo" />
      <h1>Yellow Jack</h1>
      <p>Bar Tracker System</p>
    </div>

    <div class="login-card">
      <h2>Login</h2>

      <div class="error-message" id="errorMessage"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // If already logged in, skip to dashboard
    const existingToken = localStorage.getItem('yj_token');
    if (existingToken) {
      window.location.href = 'dashboard.html';
    }

    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');

      errorMessage.style.display = 'none';

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Store token and user in localStorage
          localStorage.setItem('yj_token', data.token);
          localStorage.setItem('yj_user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          errorMessage.textContent = data.error || 'Login failed. Please try again.';
          errorMessage.style.display = 'block';
        }
      } catch (error) {
        errorMessage.textContent = 'Connection error. Please try again.';
        errorMessage.style.display = 'block';
      }
    });
  </script>
</body>
</html>
