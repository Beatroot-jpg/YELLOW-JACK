<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yellow Jack – Blacklist</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .bl-card { background:var(--secondary-30); border:1px solid var(--border-subtle); border-radius:10px; padding:16px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
    .bl-card:hover { border-color:rgba(255,100,100,0.3); }
    .bl-card .bl-name { font-size:1rem; font-weight:700; color:var(--text-main); margin-bottom:4px; }
    .bl-card .bl-reason { font-size:0.85rem; color:var(--text-muted); }
    .bl-card .bl-meta { font-size:0.75rem; color:var(--text-muted); margin-top:6px; }
    .bl-list { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
    .count-badge { font-size:0.82rem; color:var(--accent-10); font-weight:700; }
    .search-bar { display:flex; gap:10px; margin-bottom:12px; }
    .search-bar input { flex:1; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <img src="Main Logo.png" alt="Yellow Jack" />
        <h1>Yellow Jack</h1>
      </div>
      <nav class="nav">
        <a href="dashboard.html" class="nav-link" data-icon="⌂">Dashboard</a>
        <a href="analytics.html" class="nav-link" data-icon="◔">Analytics</a>
        <a href="sales.html" class="nav-link" data-icon="⟡">Sales</a>
        <a href="payroll.html" class="nav-link" data-icon="◫">Payroll</a>
        <a href="roster.html" class="nav-link" data-icon="◎">Roster</a>
        <a href="blacklist.html" class="nav-link active" data-icon="⛔">Blacklist</a>
        <a href="admin.html" class="nav-link" data-icon="⚙">Admin</a>
      </nav>
    </aside>

    <main class="main">
      <header>
        <div><h2>Blacklist</h2><span>Banned customers and persons of concern</span></div>
        <span id="currentUser">Loading...</span>
      </header>

      <!-- Add to Blacklist (Manager/Admin only) -->
      <div class="panel" id="addPanel" style="display:none">
        <div class="panel-header">
          <h3 class="panel-title">Add to Blacklist</h3>
        </div>
        <div style="display:grid;grid-template-columns:1fr 2fr auto;gap:12px;align-items:end;margin-top:8px;">
          <div class="form-field">
            <label class="form-label">Full Name</label>
            <input class="form-input" id="addName" placeholder="Person's name" />
          </div>
          <div class="form-field">
            <label class="form-label">Reason</label>
            <input class="form-input" id="addReason" placeholder="Why are they banned?" />
          </div>
          <button class="button-primary" id="addBtn">Add</button>
        </div>
        <div id="addMsg" class="ui-message"></div>
      </div>

      <!-- Search + List -->
      <div class="panel">
        <div class="panel-header">
          <h3 class="panel-title">Blacklisted Persons</h3>
          <span class="panel-subtitle count-badge" id="blCount">Loading...</span>
        </div>
        <div class="search-bar">
          <input class="form-input" id="searchInput" placeholder="Search by name..." />
        </div>
        <div class="bl-list" id="blList">
          <span style="color:var(--text-muted);font-size:0.85rem;padding:12px 0">Loading...</span>
        </div>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script>
    const user = getUser();
    if (!user) throw new Error('Not authenticated');
    const canEdit = ['Manager', 'Admin'].includes(user.role);

    document.getElementById('currentUser').textContent = `${user?.full_name} · ${user?.role}`;
    if (canEdit) document.getElementById('addPanel').style.display = 'block';

    let allEntries = [];

    async function loadBlacklist() {
      try {
        const res = await apiFetch(`${API_URL}/api/blacklist`);
        const data = await res.json();
        allEntries = data.blacklist || [];
        renderList(allEntries);
      } catch (e) { console.error('Failed to load blacklist:', e); }
    }

    function renderList(entries) {
      document.getElementById('blCount').textContent = `${entries.length} on record`;
      const container = document.getElementById('blList');
      if (!entries.length) {
        container.innerHTML = '<span style="color:var(--text-muted);font-size:0.85rem;padding:12px 0">No entries found</span>';
        return;
      }
      container.innerHTML = entries.map(e => {
        const date = e.added_at ? new Date(e.added_at).toLocaleDateString() : '—';
        const removeBtn = canEdit
          ? `<button class="button-secondary" style="border-color:rgba(255,100,100,0.4);color:#ff6464;white-space:nowrap" onclick="removeEntry(${e.id},'${e.name}')">Remove</button>`
          : '';
        return `<div class="bl-card">
          <div>
            <div class="bl-name">🚫 ${e.name}</div>
            <div class="bl-reason">${e.reason || 'No reason provided'}</div>
            <div class="bl-meta">Added by ${e.added_by || 'Unknown'} · ${date}</div>
          </div>
          ${removeBtn}
        </div>`;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderList(allEntries.filter(x => x.name.toLowerCase().includes(q) || (x.reason || '').toLowerCase().includes(q)));
    });

    function showMsg(text, ok) {
      const el = document.getElementById('addMsg');
      el.textContent = text;
      el.className = `ui-message ${ok ? 'ui-message--success' : 'ui-message--error'}`;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
      const name = document.getElementById('addName').value.trim();
      const reason = document.getElementById('addReason').value.trim();
      if (!name) { showMsg('Name is required', false); return; }
      const res = await apiFetch(`${API_URL}/api/blacklist`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, reason })
      });
      const data = await res.json();
      if (res.ok) {
        showMsg(`${name} added to blacklist`, true);
        document.getElementById('addName').value = '';
        document.getElementById('addReason').value = '';
        loadBlacklist();
      } else { showMsg(data.error || 'Failed', false); }
    });

    async function removeEntry(id, name) {
      if (!confirm(`Remove ${name} from blacklist?`)) return;
      const res = await apiFetch(`${API_URL}/api/blacklist/${id}`, { method: 'DELETE' });
      if (res.ok) loadBlacklist(); else alert('Failed to remove');
    }

    loadBlacklist();
  </script>
</body>
</html>
